<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR — Terminal de bord</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --vert: #33ff66; --fond: #030905; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    background: var(--fond); color: var(--vert);
    font-family: "Courier New", monospace; text-align: center; padding: 20px;
  }
  h1 { font-size: 1.1rem; letter-spacing: 4px; margin: 0; text-transform: uppercase; }
  h1::before { content: ">> "; }
  #lien {
    width: min(520px, 90vw); padding: 12px; font: inherit; color: var(--vert);
    background: #000; border: 1px solid var(--vert); outline: none;
  }
  #lien::placeholder { color: #1c8040; }
  #qr {
    background: #fff; padding: 16px; display: none;
    box-shadow: 0 0 25px rgba(51, 255, 102, .35);
  }
  #urltxt { font-size: .85rem; word-break: break-all; max-width: 90vw; color: #7dffa3; }
  button {
    font: inherit; color: var(--fond); background: var(--vert); border: none;
    padding: 10px 22px; cursor: pointer; letter-spacing: 2px; display: none;
  }
  .hint { font-size: .75rem; color: #1c8040; }
  @media print {
    body { background: #fff; color: #000; }
    #lien, button, .hint, h1 { display: none !important; }
    #qr { box-shadow: none; }
  }
</style>
</head>
<body>
  <h1>Accès au terminal de bord</h1>
  <input id="lien" type="url" placeholder="Colle ici le lien https://xxxx.trycloudflare.com" autofocus>
  <div id="qr"></div>
  <div id="urltxt"></div>
  <button id="save">Télécharger le QR (PNG)</button>
  <p class="hint">Le QR se met à jour automatiquement. Ctrl+P pour l'imprimer.</p>

<script>
  const zone = document.getElementById("qr");
  const input = document.getElementById("lien");
  const urltxt = document.getElementById("urltxt");
  const save = document.getElementById("save");
  let qr = null;

  function genere() {
    let url = input.value.trim();
    if (!url) { zone.style.display = "none"; save.style.display = "none"; urltxt.textContent = ""; return; }
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    zone.innerHTML = "";
    qr = new QRCode(zone, { text: url, width: 280, height: 280, correctLevel: QRCode.CorrectLevel.M });
    zone.style.display = "block";
    save.style.display = "inline-block";
    urltxt.textContent = url;
  }

  input.addEventListener("input", genere);

  save.addEventListener("click", () => {
    const img = zone.querySelector("img") || zone.querySelector("canvas");
    const data = img.tagName === "IMG" ? img.src : img.toDataURL("image/png");
    const a = document.createElement("a");
    a.href = data;
    a.download = "qr-partie-alien.png";
    a.click();
  });

  // Si un lien est déjà dans le presse-papier au chargement, proposer de le coller
  window.addEventListener("focus", async () => {
    if (input.value) return;
    try {
      const t = await navigator.clipboard.readText();
      if (/trycloudflare\.com/i.test(t)) { input.value = t.trim(); genere(); }
    } catch (e) { /* accès presse-papier refusé : pas grave */ }
  });
</script>
</body>
</html>
